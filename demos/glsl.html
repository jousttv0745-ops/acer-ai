<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLSL · AI 螢幕邊緣流光</title>
<link rel="stylesheet" href="_demo.css">
<style>
  .phone { position: absolute; left: 50%; top: 50%; height: 88%; aspect-ratio: 9 / 19.5; transform: translate(-50%, -50%); border-radius: 12% / 5.6%; overflow: hidden; background: #0b0d14; outline: 2px solid #23283a; }
  .phone canvas { width: 100%; height: 100%; display: block; }
  .ask { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); color: #eef0f6; font-size: clamp(10px, 1.4vw, 16px); white-space: nowrap; opacity: 0.9; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="phone"><canvas id="c"></canvas><div class="ask">「幫我摘要這封信」</div></div>
  </div>
  <div class="meta">
    <span><b>原生 WebGL / GLSL ES 1.0</b> · 效果：<code>ai-edge-glow</code> · 技法：圓角矩形 SDF + 角度色相流動 + <code>exp()</code> 衰減光暈 + fbm 閃爍</span>
    <button id="toggle">切換：待機 / 思考</button>
  </div>
</div>
<script>
  const cv = document.getElementById("c");
  const gl = cv.getContext("webgl", { preserveDrawingBuffer: true });
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `
    precision highp float;
    uniform vec2 uRes; uniform float uTime; uniform float uOn;
    // 圓角矩形的 signed distance：邊框上 = 0，內部 < 0
    float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    vec3 pal(float t){ // 藍 → 紫 → 粉 → 橘 循環色盤
      vec3 a=vec3(.31,.82,1.), b=vec3(.55,.48,1.), c=vec3(1.,.44,.69), d=vec3(1.,.72,.42);
      t = fract(t) * 4.;
      return t<1. ? mix(a,b,t) : t<2. ? mix(b,c,t-1.) : t<3. ? mix(c,d,t-2.) : mix(d,a,t-3.);
    }
    void main(){
      vec2 uv = gl_FragCoord.xy / uRes; vec2 p = (uv - .5) * uRes / uRes.y;
      vec2 hb = vec2(.5 * uRes.x / uRes.y, .5);
      float d = sdRound(p, hb, .06);                  // 到邊框的距離
      float ang = atan(p.y, p.x) / 6.2831;              // 以角度決定色相，讓顏色繞邊流動
      float n = noise(vec2(ang * 12. + uTime * .8, uTime * .5));
      float width = mix(.012, .05, uOn) * (.7 + .6 * n);
      float glow = exp(d / width);                      // d<0 往內，指數衰減
      vec3 col = pal(ang + uTime * mix(.05, .25, uOn)) * glow * mix(.6, 1.4, uOn);
      // 思考時中央的淡淡漣漪
      float ripple = uOn * .08 * smoothstep(.0, .6, sin(length(p) * 18. - uTime * 4.)) * exp(-length(p) * 3.);
      gl_FragColor = vec4(col + ripple * pal(uTime * .1), 1.);
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(prog, "uRes"), uTime = gl.getUniformLocation(prog, "uTime"), uOn = gl.getUniformLocation(prog, "uOn");
  let on = 0, target = 1;
  document.getElementById("toggle").onclick = () => { target = target ? 0 : 1; };
  function frame(ms) {
    const w = cv.clientWidth * devicePixelRatio | 0, h = cv.clientHeight * devicePixelRatio | 0;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    on += (target - on) * 0.05;
    gl.uniform2f(uRes, w, h); gl.uniform1f(uTime, ms / 1000); gl.uniform1f(uOn, on);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
