<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime.js v4 · NPU 運算網格波＋TOPS 數字跳動</title>
<link rel="stylesheet" href="_demo.css">
<style>
  .grid { position: absolute; left: 6%; top: 12%; width: 50%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
  .cell { background: #1a1e2c; border-radius: 2px; }
  .readout { position: absolute; right: 7%; top: 30%; text-align: right; }
  .readout .num { font-size: clamp(40px, 9vw, 120px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; }
  .readout .unit { color: var(--ai-1); font-size: clamp(14px, 2vw, 24px); letter-spacing: 0.2em; }
  .readout .label { color: var(--muted); font-size: clamp(11px, 1.3vw, 16px); margin-top: 8px; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="readout">
      <div class="num" id="num">0</div>
      <div class="unit">TOPS</div>
      <div class="label">Neural Processing Unit · 裝置端 AI 運算</div>
    </div>
  </div>
  <div class="meta">
    <span><b>Anime.js 4.5</b> · 效果：<code>stagger-grid-wave</code> + <code>data-counter</code> · API：<code>animate</code> <code>stagger({grid, from})</code> <code>createTimeline</code> <code>utils.round</code></span>
    <button id="replay">重播</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script>
  const { animate, createTimeline, stagger, utils } = anime;
  const COLS = 16, ROWS = 16;
  const grid = document.getElementById("grid");
  for (let i = 0; i < COLS * ROWS; i++) grid.appendChild(Object.assign(document.createElement("div"), { className: "cell" }));

  const counter = { v: 0 };
  const tl = createTimeline({ defaults: { ease: "outExpo" } });
  // 1. 從中心擴散的運算波：grid stagger 是 Anime.js 的招牌
  tl.add(".cell", {
    scale: [{ to: [0.2, 1.15], duration: 500 }, { to: 1, duration: 600 }],
    backgroundColor: [{ to: "#4fd1ff", duration: 300 }, { to: "#8b7bff", duration: 500 }, { to: "#1f2436", duration: 900 }],
    delay: stagger(40, { grid: [COLS, ROWS], from: "center" }),
  })
  // 2. 數字跳動：animate 一個 JS 物件，onUpdate 寫回 DOM
    .add(counter, {
      v: 50, duration: 1800, modifier: utils.round(0),
      onUpdate: () => { document.getElementById("num").textContent = counter.v; },
    }, 200)
  // 3. idle：隨機亮點，模擬持續推論
    .call(() => {
      animate(".cell", {
        opacity: [{ to: 0.35, duration: 900 }, { to: 1, duration: 900 }],
        delay: stagger(120, { from: "random" }),
        loop: true,
      });
    });
  document.getElementById("replay").onclick = () => tl.restart();
</script>
</body>
</html>
