<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixiJS · AI 光球粒子漩渦</title>
<link rel="stylesheet" href="_demo.css">
</head>
<body>
<div class="frame">
  <div class="stage" id="stage"></div>
  <div class="meta">
    <span><b>PixiJS 8.21</b> · 效果：<code>ai-orb</code> + <code>particle-swarm</code> · API：<code>Application.init</code> <code>Graphics</code> <code>BlurFilter</code> <code>blendMode:'add'</code> <code>Ticker</code></span>
    <button id="toggle">切換：聆聽 / 思考</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script>
<script>
(async () => {
  const stage = document.getElementById("stage");
  const app = new PIXI.Application();
  await app.init({ resizeTo: stage, background: "#07080c", antialias: true });
  stage.appendChild(app.canvas);

  // 光暈層：三個加色混合的模糊圓，互相繞行 → Siri / Gemini 式的流動色彩
  const glow = new PIXI.Container();
  glow.filters = [new PIXI.BlurFilter({ strength: 40, quality: 4 })];
  const colors = [0x4fd1ff, 0x8b7bff, 0xff6fb1];
  const blobs = colors.map(c => {
    const g = new PIXI.Graphics().circle(0, 0, 70).fill({ color: c, alpha: 0.9 });
    g.blendMode = "add";
    glow.addChild(g);
    return g;
  });
  app.stage.addChild(glow);

  // 粒子層：數百個小點繞光球旋轉，「思考」時收縮加速
  const dots = new PIXI.Container();
  app.stage.addChild(dots);
  const N = 420, parts = [];
  for (let i = 0; i < N; i++) {
    const g = new PIXI.Graphics().circle(0, 0, Math.random() * 1.6 + 0.4).fill(0xffffff);
    g.blendMode = "add";
    const p = { g, a: Math.random() * Math.PI * 2, r: 110 + Math.random() * 160, s: 0.002 + Math.random() * 0.006, tilt: Math.random() * 0.6 + 0.4 };
    dots.addChild(g); parts.push(p);
  }

  let thinking = 0, target = 0, t = 0;
  document.getElementById("toggle").onclick = () => { target = target ? 0 : 1; };
  app.ticker.add(tk => {
    t += tk.deltaTime / 60;
    thinking += (target - thinking) * 0.05;
    const cx = app.screen.width / 2, cy = app.screen.height / 2;
    const scale = Math.min(app.screen.width, app.screen.height) / 720;
    glow.position.set(cx, cy);
    blobs.forEach((b, i) => {
      const ang = t * (0.6 + i * 0.25 + thinking) + i * 2.1;
      b.position.set(Math.cos(ang) * 40 * scale, Math.sin(ang * 1.3) * 40 * scale);
      b.scale.set(scale * (1 + 0.15 * Math.sin(t * 2 + i) + thinking * 0.25));
    });
    parts.forEach(p => {
      p.a += p.s * (1 + thinking * 4) * tk.deltaTime;
      const r = p.r * (1 - thinking * 0.45) * scale;
      p.g.position.set(cx + Math.cos(p.a) * r, cy + Math.sin(p.a) * r * p.tilt);
      p.g.alpha = 0.35 + 0.65 * Math.abs(Math.sin(p.a * 3 + t));
    });
  });
})();
</script>
</body>
</html>
