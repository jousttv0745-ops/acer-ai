<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSAP · AI 開啟前後對比擦除</title>
<link rel="stylesheet" href="_demo.css">
<style>
  .layer { position: absolute; inset: 0; }
  .layer svg { width: 100%; height: 100%; display: block; }
  /* AI 關閉：暗、灰、低對比，背景清楚（雜亂） */
  #before svg { filter: brightness(0.55) contrast(0.8) saturate(0.45); }
  #noise { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.14; mix-blend-mode: screen; }
  /* AI 開啟：打光、色彩還原、背景虛化 */
  #after { clip-path: inset(0 0 0 var(--cut, 50%)); }
  #after .bg { filter: blur(10px); }
  #after svg { filter: brightness(1.08) contrast(1.05) saturate(1.15); }
  .divider { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 3px; margin-left: -1.5px; background: linear-gradient(var(--ai-1), var(--ai-2), var(--ai-3)); box-shadow: 0 0 18px 4px rgba(139, 123, 255, 0.55); cursor: ew-resize; touch-action: none; }
  .divider::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--ink); background: rgba(20, 24, 39, 0.9); border: 2px solid var(--ai-2); }
  .tag { position: absolute; top: 5%; padding: 4px 12px; border-radius: 999px; font-size: clamp(10px, 1.3vw, 15px); font-weight: 600; background: rgba(7, 8, 12, 0.7); }
  .tag.off { left: 4%; color: var(--muted); }
  .tag.on { right: 4%; color: var(--ai-1); }
  .caption { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); font-size: clamp(12px, 1.8vw, 22px); font-weight: 700; white-space: nowrap; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">
    <div class="layer" id="before"><svg viewBox="0 0 1280 720"><use href="#scene"/></svg><canvas id="noise" width="320" height="180"></canvas></div>
    <div class="layer" id="after"><svg viewBox="0 0 1280 720"><g class="bg"><use href="#room"/></g><use href="#person"/></svg></div>
    <div class="divider" id="divider" role="slider" aria-label="對比位置" aria-valuemin="0" aria-valuemax="100" tabindex="0"></div>
    <span class="tag off">AI 關閉</span><span class="tag on">AI 視訊增強 開啟</span>
    <div class="caption">昏暗會議室，也能清楚上鏡</div>
  </div>
  <div class="meta">
    <span><b>GSAP 3.15</b> · 效果：<code>before-after-wipe</code> · API：CSS 變數 <code>--cut</code> + <code>clip-path: inset()</code> 補間、<code>timeline repeat</code>；分隔線可拖曳（Pointer Events）</span>
    <button id="replay">重播</button>
  </div>
</div>

<!-- 共用場景：同一份 SVG，兩側只差濾鏡 → 對比才公平 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="lamp" cx="0.75" cy="0.2" r="0.6"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b99a"/><stop offset="1" stop-color="#c98f72"/></linearGradient>
    <g id="room">
      <rect width="1280" height="720" fill="#3b4a5e"/>
      <rect x="0" y="470" width="1280" height="250" fill="#2a2f3d"/>
      <rect x="80" y="90" width="300" height="360" fill="#5a7089"/><rect x="95" y="105" width="270" height="330" fill="#8fb3d1"/>
      <rect x="880" y="120" width="260" height="170" rx="6" fill="#6b5a4a"/><rect x="895" y="135" width="230" height="140" fill="#c9a36b"/>
      <rect x="900" y="360" width="220" height="150" fill="#4a3a30"/><rect x="920" y="300" width="40" height="60" fill="#2f7a5a"/><rect x="990" y="320" width="70" height="40" fill="#b85a4a"/>
      <rect width="1280" height="720" fill="url(#lamp)"/>
    </g>
    <g id="person">
      <path d="M430 720 C 440 560, 520 500, 640 500 C 760 500, 840 560, 850 720 Z" fill="#3f5fa8"/>
      <rect x="600" y="430" width="80" height="90" rx="20" fill="url(#skin)"/>
      <ellipse cx="640" cy="360" rx="105" ry="125" fill="url(#skin)"/>
      <path d="M535 350 C 530 240, 600 215, 650 220 C 720 222, 760 270, 748 350 C 730 300, 690 280, 640 285 C 590 290, 555 310, 535 350 Z" fill="#2b2320"/>
      <ellipse cx="600" cy="370" rx="10" ry="7" fill="#2b2320"/><ellipse cx="682" cy="370" rx="10" ry="7" fill="#2b2320"/>
      <path d="M612 420 Q 640 440 668 420" stroke="#8a4a3e" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="scene"><use href="#room"/><use href="#person"/></g>
  </defs>
</svg>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
  const stage = document.getElementById("stage");
  const state = { cut: 100 };
  const apply = () => stage.style.setProperty("--cut", state.cut + "%");

  // 雜訊層：只在「AI 關閉」那側，模擬感光元件噪點
  const nc = document.getElementById("noise"), nx = nc.getContext("2d"), img = nx.createImageData(320, 180);
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); // 可重現亂數
  function noise() { for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } nx.putImageData(img, 0, 0); }
  gsap.ticker.add(noise);

  // 時間軸：全關 → 掃到全開 → 停在中間讓觀眾比較 → 左右晃一下
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6, onUpdate: apply });
  tl.set(state, { cut: 100 })
    .to(state, { cut: 0, duration: 1.4, ease: "power3.inOut", delay: 0.6 })
    .to(state, { cut: 50, duration: 1.0, ease: "power2.out", delay: 0.5 })
    .to(state, { cut: 35, duration: 0.8, ease: "sine.inOut" })
    .to(state, { cut: 62, duration: 1.0, ease: "sine.inOut" })
    .to(state, { cut: 50, duration: 0.8, ease: "sine.inOut" })
    .to({}, { duration: 1.2 });

  // 拖曳分隔線：暫停時間軸，改由手指／滑鼠控制
  const div = document.getElementById("divider");
  const setFromX = (x) => { const r = stage.getBoundingClientRect(); state.cut = Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)); apply(); };
  div.addEventListener("pointerdown", (e) => { tl.pause(); div.setPointerCapture(e.pointerId); setFromX(e.clientX); });
  div.addEventListener("pointermove", (e) => { if (div.hasPointerCapture(e.pointerId)) setFromX(e.clientX); });
  div.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { tl.pause(); state.cut += e.key === "ArrowLeft" ? -5 : 5; state.cut = Math.min(100, Math.max(0, state.cut)); apply(); } });
  document.getElementById("replay").onclick = () => tl.restart();
</script>
</body>
</html>
