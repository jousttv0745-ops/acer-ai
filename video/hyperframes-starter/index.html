<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080c; }
    </style>
  </head>
  <body>
    <!-- 12 秒 AI PC 形象片骨架：每一段是一個可重用的效果區塊（compositions/*.html） -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="scene-edge-glow-headline" data-composition-id="edge-glow-headline" data-composition-src="compositions/01-edge-glow-headline.html" data-start="0" data-duration="3.2" data-track-index="0"></div>
      <div id="scene-npu-grid-tops" data-composition-id="npu-grid-tops" data-composition-src="compositions/02-npu-grid-tops.html" data-start="3.2" data-duration="3.3" data-track-index="0"></div>
      <div id="scene-float-cards" data-composition-id="float-cards" data-composition-src="compositions/03-float-cards.html" data-start="6.5" data-duration="3.5" data-track-index="0"></div>
      <div id="scene-end-card" data-composition-id="end-card" data-composition-src="compositions/04-end-card.html" data-start="10" data-duration="2" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
